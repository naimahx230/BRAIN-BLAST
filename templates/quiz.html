<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Blast</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
        font-family: 'Comic Neue', cursive;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        color: #fff;
    }

    .quiz-container {
        background: rgba(0, 0, 0, 0.5);
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        text-align: center;
        width: 90%;
        max-width: 500px;
    }

    h1 {
        font-size: 2em;
        margin-bottom: 20px;
        text-shadow: 2px 2px #ff69b4;
    }

    .question {
        font-size: 1.3em;
        margin-bottom: 20px;
    }

    .options button {
        display: block;
        margin: 10px auto;
        padding: 10px 20px;
        font-size: 1.1em;
        width: 80%;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #ff6f91;
        color: #fff;
        transition: transform 0.2s, background 0.2s;
    }

    .options button:hover {
        transform: scale(1.05);
        background: #ff4971;
    }

    .progress {
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="quiz-container">
    <h1>Brain Blast ✨</h1>
    <div class="question">{{ question.question }}</div>
    <form method="POST" class="options">
        {% for option in question.options %}
            <button type="submit" name="answer" value="{{ option }}">{{ option }}</button>
        {% endfor %}
    </form>
    <div class="progress">Question {{ q_num }} of {{ total }}</div>
</div>

</body>
</html>
